<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Your Moment</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="index.html">QR Photo Wall</a><div class="navlinks"><a class="btn secondary optional" href="wall.html">Live Wall</a><a class="btn" href="upload.html">Upload Photo</a></div></nav><main class="hero"><section><div class="eyebrow">Live community photo wall</div><h1 id="eventName">Share Your Moment</h1><p class="lead">Scan the QR code with your phone, choose a photo from your camera or album, and watch it appear on the live wall.</p><div class="actions"><a class="btn" href="upload.html">Upload a Photo</a><a class="btn secondary" href="wall.html">Open Live Wall</a></div></section><section class="qr-card"><h2>Scan to upload</h2><p class="muted">No account required.</p><img id="qr" alt="QR code for photo upload"><p class="muted" id="qrUrl"></p></section></main><script src="config.js"></script><script>document.getElementById('eventName').textContent=APP_CONFIG.EVENT_NAME;const base=APP_CONFIG.SITE_URL&&!APP_CONFIG.SITE_URL.startsWith('YOUR_')?APP_CONFIG.SITE_URL:location.href.replace(/\/[^/]*$/,'');const u=base+'/upload.html';document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u);document.getElementById('qrUrl').textContent=u;</script></body></html>
