<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Photo</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="index.html">QR Photo Wall</a><div class="navlinks"><a class="btn secondary" href="wall.html">Live Wall</a></div></nav><main class="page"><h1>Share a photo</h1><p class="lead">Choose up to <span id="maxFiles"></span> photos. JPG, PNG and WebP are supported.</p><div id="notice"></div><section class="panel"><label class="drop" id="drop"><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="drop-icon">＋</div><h2>Tap to choose photos</h2><p class="muted">Camera or photo library</p></label><div class="preview-grid" id="previews"></div><div class="field"><label for="name">Your name <span class="muted">(optional)</span></label><input id="name" maxlength="50" placeholder="e.g. Alex"></div><div class="field"><label for="caption">Message <span class="muted">(optional)</span></label><textarea id="caption" maxlength="200" placeholder="Say something about the moment..."></textarea></div><div class="actions"><button class="btn" id="upload">Upload & Share</button></div><div id="status" class="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
maxFiles.textContent=C.MAX_FILES;setupNotice(notice);let selected=[];const render=()=>previews.innerHTML=selected.map(f=>`<div class="preview"><img src="${URL.createObjectURL(f)}"></div>`).join('');files.onchange=()=>{selected=[...files.files].slice(0,C.MAX_FILES);render()};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');selected=[...e.dataTransfer.files].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type)).slice(0,C.MAX_FILES);render()};
function msg(t,ok=false){status.textContent=t;status.className='status show '+(ok?'ok':'err')}
upload.onclick=async()=>{if(!configured())return msg('Complete Supabase setup first.');if(!selected.length)return msg('Please choose at least one photo.');for(const f of selected){if(f.size>C.MAX_FILE_MB*1024*1024)return msg(`${f.name} is larger than ${C.MAX_FILE_MB} MB.`);if(!/^image\/(jpeg|png|webp)$/.test(f.type))return msg('Only JPG, PNG and WebP files are allowed.')}upload.disabled=true;upload.textContent='Uploading...';try{const client=sb();for(const f of selected){const ext=f.name.split('.').pop().toLowerCase();const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error:e1}=await client.storage.from('photos').upload(path,f,{contentType:f.type,upsert:false});if(e1)throw e1;const {data}=client.storage.from('photos').getPublicUrl(path);const {error:e2}=await client.from('photos').insert({image_url:data.publicUrl,storage_path:path,uploader_name:name.value.trim()||null,caption:caption.value.trim()||null});if(e2)throw e2}selected=[];files.value='';previews.innerHTML='';caption.value='';msg('Uploaded! Your photo is now on the live wall.',true)}catch(e){msg(e.message||'Upload failed. Please try again.')}finally{upload.disabled=false;upload.textContent='Upload & Share'}};
</script></body></html>
