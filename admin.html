<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Admin</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="index.html">QR Photo Wall</a><div class="navlinks"><a class="btn secondary" href="wall.html">Live Wall</a></div></nav><main class="page wide"><h1>Photo Admin</h1><p class="lead">Basic moderation panel. Protect this page with your hosting provider before public use.</p><div id="notice"></div><section class="wall" id="wall"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
if(!setupNotice(notice)){const client=sb();async function load(){const {data,error}=await client.from('photos').select('*').order('created_at',{ascending:false}).limit(200);wall.innerHTML=error?`<div class="empty">${esc(error.message)}</div>`:data.map(p=>photoCard(p,true)).join('')}load();wall.onclick=async e=>{const b=e.target.closest('.delete');if(!b)return;if(!confirm('Delete this photo?'))return;b.disabled=true;const {error:e1}=await client.storage.from('photos').remove([b.dataset.path]);const {error:e2}=await client.from('photos').delete().eq('id',b.dataset.id);if(e1||e2){alert((e1||e2).message);b.disabled=false}else b.closest('.photo').remove()}}
</script></body></html>
