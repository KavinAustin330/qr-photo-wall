<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Photo Wall</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="index.html">QR Photo Wall</a><div class="navlinks"><a class="btn" href="upload.html">＋ Add Photo</a></div></nav><main class="page wide"><div class="wall-head"><div><div class="eyebrow">Community gallery</div><h1>Live Photo Wall</h1><p class="lead">New moments appear here automatically.</p></div><span class="badge">● LIVE</span></div><div id="notice"></div><section class="wall" id="wall"><div class="empty">Loading photos...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
if(!setupNotice(notice)){const client=sb();async function load(){const {data,error}=await client.from('photos').select('*').eq('approved',true).order('created_at',{ascending:false}).limit(100);if(error){wall.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}wall.innerHTML=data.length?data.map(p=>photoCard(p)).join(''):'<div class="empty">No photos yet. Be the first to share one!</div>'}load();client.channel('photo-wall').on('postgres_changes',{event:'INSERT',schema:'public',table:'photos'},payload=>{if(payload.new.approved){const empty=wall.querySelector('.empty');if(empty)empty.remove();wall.insertAdjacentHTML('afterbegin',photoCard(payload.new))}}).on('postgres_changes',{event:'DELETE',schema:'public',table:'photos'},payload=>{wall.querySelector(`[data-id="${payload.old.id}"]`)?.remove()}).subscribe()}
</script></body></html>
